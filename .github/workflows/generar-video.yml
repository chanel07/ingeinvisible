name: Generar Video

on:
  workflow_dispatch:
    inputs:
      tema:
        description: 'Tema del video (ej: Cómo funciona un ascensor)'
        required: true
        type: string

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar edge-tts
        run: pip install edge-tts

      - name: Instalar FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias de Remotion
        working-directory: video-agua
        run: npm ci

      - name: Generar guion y plan con Gemini
        working-directory: video-agua
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TEMA: ${{ inputs.tema }}
        run: node scripts/generar-guion.mjs

      - name:  Limpiar guion y generar voz
        working-directory: video-agua
        run:sed -i 's/#//g; s/\*//g; s/_//g; s/\[//g; s/\]//g; s/---//g' public/guion.txt
             edge-tts --voice es-CO-GonzaloNeural --file public/guion.txt --write-media public/voz.mp3 --write-subtitles public/voz.srt

      - name: Descargar clips de Pexels
        working-directory: video-agua
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
        run: rm -rf public/clips && node scripts/descargar-clips.mjs

      - name: Comprimir clips
        working-directory: video-agua
        run: |
          mkdir -p public/clips-mini
          for f in public/clips/*.mp4; do
            n=$(basename "$f")
            ffmpeg -y -loglevel error -i "$f" -t 20 -vf "scale=1280:-2" -c:v libx264 -crf 28 -preset veryfast -an "public/clips-mini/$n"
          done
          rm -rf public/clips
          mv public/clips-mini public/clips

      - name: Renderizar video
        working-directory: video-agua
        run: npx remotion render AguaGrifo out/video.mp4 --scale=0.5 --concurrency=1 --jpeg-quality=70

      - name: Comprimir video final
        working-directory: video-agua
        run: ffmpeg -y -i out/video.mp4 -c:v libx264 -crf 32 -preset veryfast -c:a aac -b:a 96k out/video-final.mp4

      - name: Subir video al repositorio
        run: |
          cd video-agua
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f out/video-final.mp4
          git commit -m "Video: ${{ inputs.tema }}"
          git push

      - name: Subir video como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: video-agua/out/video-final.mp4
          retention-days: 7
