name: Generar Perros

on:
  workflow_dispatch:
    inputs:
      tema:
        description: 'Tema del Reel (dejar vacío para tomar de la lista)'
        required: false
        type: string
      titulo:
        description: 'Título en pantalla (opcional, sale grande los primeros segundos)'
        required: false
        type: string
      duracion:
        description: 'Duración del Reel'
        required: false
        type: choice
        default: largo
        options:
          - largo
          - corto
          - extendido
      voz:
        description: 'Voz: vacío = Gemini (natural), gonzalo = la voz de antes'
        required: false
        type: string
      estilo:
        description: 'Estilo de las imágenes que dibuja la IA cuando no hay clip'
        required: false
        type: choice
        default: '3d'
        options:
          - '3d'
          - 'real'

jobs:
  perros:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: video-agua/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache de Remotion (Chromium)
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: remotion-${{ runner.os }}-v1

      - name: Instalar edge-tts
        run: pip install --upgrade edge-tts

      - name: Instalar FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias de Remotion
        working-directory: video-agua
        run: npm ci

      - name: Elegir tema
        id: tema
        working-directory: video-agua
        env:
          TEMA_MANUAL: ${{ inputs.tema }}
        run: |
          if [ -n "$TEMA_MANUAL" ]; then
            TEMA="$TEMA_MANUAL"
          else
            TEMA=$(node scripts/siguiente-tema.mjs ../temas-perros.txt)
          fi
          TEMA=$(printf '%s' "$TEMA" | tr '\n' ' ')
          echo "Tema elegido: $TEMA"
          echo "TEMA=$TEMA" >> "$GITHUB_OUTPUT"

      - name: Generar guion y plan con Gemini
        working-directory: video-agua
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          TEMA: ${{ steps.tema.outputs.TEMA }}
          DURACION: ${{ inputs.duracion }}
        run: node scripts/generar-perros.mjs

      - name: Limpiar guion y generar voz
        working-directory: video-agua
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: eastus
          VOZ_PEDIDA: ${{ inputs.voz }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          sed -i 's/#//g; s/\*//g; s/_//g; s/\[//g; s/\]//g; s/---//g' public/guion.txt
          echo "----- GUION QUE SE VA A NARRAR -----"
          cat public/guion.txt
          echo "------------------------------------"
          VOZ_LISTA=no
          # Voz por defecto: Gemini (natural). Con "gonzalo" se usa la voz de antes.
          VOZ_ELEGIDA="$(printf '%s' "$VOZ_PEDIDA" | tr '[:upper:]' '[:lower:]' | tr -d ' ')"
          if [ "$VOZ_ELEGIDA" != "gonzalo" ]; then
            echo "===== Usando la voz natural de Gemini ====="
            if node scripts/voz-gemini.mjs; then
              pip install --quiet faster-whisper
              if python scripts/transcribir-voz.py; then
                VOZ_LISTA=si
              else
                echo "AVISO: no se pudieron sacar los subtítulos de la voz de Gemini, uso la de Gonzalo"
              fi
            else
              echo "AVISO: Gemini no pudo hacer la voz, uso la de Gonzalo"
            fi
          fi
          if [ "$VOZ_LISTA" = "si" ]; then
            echo "Voz de Gemini lista"
          elif edge-tts --voice es-CO-GonzaloNeural --file public/guion.txt --write-media public/voz.mp3 --write-subtitles public/voz.srt; then
            echo "Voz generada con edge-tts"
          else
            echo "===== edge-tts falló, uso Azure con la misma voz de Gonzalo ====="
            node scripts/voz-azure.mjs
            node scripts/srt-desde-audio.mjs
          fi

      - name: Descargar clips de Pexels
        working-directory: video-agua
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          CLIPS_OBLIGATORIA: 'dog|dogs|puppy|puppies'
          CLIPS_VERTICAL: 'si'
          # Gemini revisa cada clip antes de usarlo (si muestra lo que dice la voz)
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          # Si ningun clip sirve, Cloudflare dibuja la imagen exacta de lo que dice la voz
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLIPS_ESTILO_DIBUJO: ${{ inputs.estilo || '3d' }}
        run: rm -rf public/clips && node scripts/descargar-clips.mjs

      - name: Preparar clips
        working-directory: video-agua
        run: |
          mkdir -p public/clips-mini
          for f in public/clips/*.mp4; do
            n=$(basename "$f")
            ffmpeg -y -loglevel error -stream_loop -1 -i "$f" -t 15 -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" -c:v libx264 -crf 20 -preset veryfast -an "public/clips-mini/$n"
          done
          rm -rf public/clips
          mv public/clips-mini public/clips

      - name: Sacar fotograma de respaldo
        working-directory: video-agua
        run: |
          PRIMERO=$(node -e "const p=require('./public/plan.json');console.log((p.plan||p)[0].clip)" 2>/dev/null || ls public/clips | head -n1)
          ffmpeg -y -loglevel error -ss 0.4 -i "public/clips/$PRIMERO" -frames:v 1 public/portada.jpg
          echo "Fotograma de respaldo sacado de $PRIMERO"

      - name: Renderizar Reel
        working-directory: video-agua
        env:
          REMOTION_MARCA: ' '
          REMOTION_LIMPIO: 'si'
          REMOTION_TITULO: ${{ inputs.titulo }}
          # El perrito 3D de la pagina (src/Perrito.tsx). Para quitarlo, cambia perro por no
          REMOTION_PERSONAJE: 'perro'
        run: |
          mkdir -p out
          npx remotion render Short out/perros-final.mp4 \
            --concurrency=4 \
            --jpeg-quality=95 \
            --crf=20

      - name: Medir resultado
        working-directory: video-agua
        run: |
          MB=$(du -m out/perros-final.mp4 | cut -f1)
          echo "PESO: ${MB} MB"
          ffprobe -v error -show_entries format=duration,bit_rate -of default=noprint_wrappers=1 out/perros-final.mp4

      - name: Guardar Reel como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: perros-${{ inputs.duracion || 'largo' }}-${{ github.run_number }}
          path: video-agua/out/perros-final.mp4
          retention-days: 7

      - name: Subir Reel al repositorio
        if: inputs.duracion != 'extendido'
        env:
          DURACION: ${{ inputs.duracion }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f video-agua/out/perros-final.mp4
          git add temas-perros.txt
          git add -f video-agua/clips-usados.json || true
          git commit -m "Perros ($DURACION)" || true
          # Quita los archivos de trabajo para que no estorben al traer cambios del repo
          git reset --hard -q HEAD
          git clean -fdq
          for i in 1 2 3; do
            if git pull --rebase -X theirs && git push; then
              echo "Reel subido"
              exit 0
            fi
            echo "No se pudo subir (intento $i/3), reintento en 10s..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1

      - name: Marcar tema usado
        if: inputs.duracion == 'extendido'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add temas-perros.txt
          git add -f video-agua/clips-usados.json || true
          git commit -m "Marcar tema usado y clips usados" || true
          git reset --hard -q HEAD
          git clean -fdq
          git pull --rebase -X theirs || true
          git push || true
