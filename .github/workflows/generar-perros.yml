name: Generar Perros

on:
  workflow_dispatch:
    inputs:
      tema:
        description: 'Tema del Reel (dejar vacío para tomar de la lista)'
        required: false
        type: string
      titulo:
        description: 'Título en pantalla (opcional, sale grande los primeros segundos)'
        required: false
        type: string
      duracion:
        description: 'Duración del Reel'
        required: false
        type: choice
        default: largo
        options:
          - largo
          - corto
          - extendido

jobs:
  perros:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: video-agua/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache de Remotion (Chromium)
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: remotion-${{ runner.os }}-v1

      - name: Instalar edge-tts
        run: pip install --upgrade edge-tts

      - name: Instalar FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias de Remotion
        working-directory: video-agua
        run: npm ci

      - name: Elegir tema
        id: tema
        working-directory: video-agua
        env:
          TEMA_MANUAL: ${{ inputs.tema }}
        run: |
          if [ -n "$TEMA_MANUAL" ]; then
            TEMA="$TEMA_MANUAL"
          else
            TEMA=$(node scripts/siguiente-tema.mjs ../temas-perros.txt)
          fi
          TEMA=$(printf '%s' "$TEMA" | tr '\n' ' ')
          echo "Tema elegido: $TEMA"
          echo "TEMA=$TEMA" >> "$GITHUB_OUTPUT"

      - name: Generar guion y plan con Gemini
        working-directory: video-agua
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          TEMA: ${{ steps.tema.outputs.TEMA }}
          DURACION: ${{ inputs.duracion }}
        run: node scripts/generar-perros.mjs

      - name: Limpiar guion y generar voz
        working-directory: video-agua
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: eastus
        run: |
          sed -i 's/#//g; s/\*//g; s/_//g; s/\[//g; s/\]//g; s/---//g' public/guion.txt
          echo "----- GUION QUE SE VA A NARRAR -----"
          cat public/guion.txt
          echo "------------------------------------"
          if edge-tts --voice es-CO-GonzaloNeural --file public/guion.txt --write-media public/voz.mp3 --write-subtitles public/voz.srt; then
            echo "Voz generada con edge-tts"
          else
            echo "===== edge-tts falló, uso Azure con la misma voz de Gonzalo ====="
            node scripts/voz-azure.mjs
            node scripts/srt-desde-audio.mjs
          fi

      - name: Descargar clips de Pexels
        working-directory: video-agua
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          CLIPS_OBLIGATORIA: 'dog|dogs|puppy|puppies'
          CLIPS_VERTICAL: 'si'
        run: rm -rf public/clips && node scripts/descargar-clips.mjs

      - name: Preparar clips
        working-directory: video-agua
        run: |
          mkdir -p public/clips-mini
          for f in public/clips/*.mp4; do
            n=$(basename "$f")
            ffmpeg -y -loglevel error -i "$f" -t 15 -vf "scale='if(gt(iw,ih),-2,1080)':'if(gt(iw,ih),1920,-2)'" -c:v libx264 -crf 20 -preset veryfast -an "public/clips-mini/$n"
          done
          rm -rf public/clips
          mv public/clips-mini public/clips

      - name: Sacar fotograma de respaldo
        working-directory: video-agua
        run: |
          PRIMERO=$(node -e "const p=require('./public/plan.json');console.log((p.plan||p)[0].clip)" 2>/dev/null || ls public/clips | head -n1)
          ffmpeg -y -loglevel error -ss 0.4 -i "public/clips/$PRIMERO" -frames:v 1 public/portada.jpg
          echo "Fotograma de respaldo sacado de $PRIMERO"

      - name: Renderizar Reel
        working-directory: video-agua
        env:
          REMOTION_MARCA: ' '
          REMOTION_LIMPIO: 'si'
          REMOTION_TITULO: ${{ inputs.titulo }}
        run: |
          mkdir -p out
          npx remotion render Short out/perros-final.mp4 \
            --concurrency=2 \
            --jpeg-quality=95 \
            --crf=20

      - name: Medir resultado
        working-directory: video-agua
        run: |
          MB=$(du -m out/perros-final.mp4 | cut -f1)
          echo "PESO: ${MB} MB"
          ffprobe -v error -show_entries format=duration,bit_rate -of default=noprint_wrappers=1 out/perros-final.mp4

      - name: Subir Reel al repositorio
        if: inputs.duracion != 'extendido'
        env:
          DURACION: ${{ inputs.duracion }}
        run: |
          cd video-agua
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f out/perros-final.mp4
          git commit -m "Perros ($DURACION)"
          git push

      - name: Guardar video extendido para descargar
        if: inputs.duracion == 'extendido'
        uses: actions/upload-artifact@v4
        with:
          name: perros-extendido-${{ github.run_number }}
          path: video-agua/out/perros-final.mp4
          retention-days: 7

      - name: Marcar tema usado
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull --rebase || true
          git add temas-perros.txt
          git add -f video-agua/clips-usados.json || true
          git commit -m "Marcar tema usado y clips usados" || true
          git push || true
