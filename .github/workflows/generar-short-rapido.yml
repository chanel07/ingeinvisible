name: Generar Short RAPIDO

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      tema:
        description: 'Tema del Short (dejar vacío para tomar de la lista)'
        required: false
        type: string
      voz:
        description: 'Voz: vacío = Gemini (natural), gonzalo = la voz de antes, o el nombre de tu grabación en video-agua/public/voces/'
        required: false
        type: string
      estilo:
        description: 'Estilo de las imágenes que dibuja la IA cuando no hay clip'
        required: false
        type: choice
        default: '3d'
        options:
          - '3d'
          - 'real'
      imagenes:
        description: 'Imágenes: alternado = clips reales + dibujos en las explicaciones; dibujado = todo dibujado; clips = solo clips'
        required: false
        type: choice
        default: 'alternado'
        options:
          - 'alternado'
          - 'dibujado'
          - 'clips'
      evitar:
        description: 'Clips que NO deben salir, en inglés separados por coma (ej: child, bedroom, car)'
        required: false
        type: string

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: video-agua/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache de Remotion (Chromium)
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: remotion-${{ runner.os }}-v1

      - name: Instalar edge-tts
        run: pip install --upgrade edge-tts

      - name: Instalar FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias de Remotion
        working-directory: video-agua
        run: npm ci

      - name: Elegir tema
        id: tema
        working-directory: video-agua
        env:
          TEMA_INPUT: ${{ inputs.tema }}
        run: |
          if [ -n "$TEMA_INPUT" ]; then
            TEMA="$TEMA_INPUT"
          else
            TEMA=$(node scripts/siguiente-tema.mjs ../temas-shorts.txt)
          fi
          TEMA=$(printf '%s' "$TEMA" | tr '\n' ' ')
          echo "Tema elegido: $TEMA"
          echo "TEMA=$TEMA" >> "$GITHUB_OUTPUT"

      - name: Generar guion y plan con Gemini
        working-directory: video-agua
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          TEMA: ${{ steps.tema.outputs.TEMA }}
          IMAGENES: ${{ inputs.imagenes || 'alternado' }}
        run: node scripts/generar-short.mjs

      - name: Limpiar guion y generar voz
        working-directory: video-agua
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: eastus
          VOZ_PROPIA: ${{ inputs.voz }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          PAL='clip|toma|escena|visual|imagen|b-roll|seccion|sección|SECCIÓN|section|parte|capitulo|capítulo|CAPÍTULO|titulo|título|TÍTULO|nota'
          sed -i -E "/^[[:space:]]*[(\[]?[0-9]*[.)]?[[:space:]]*($PAL)[[:space:]]*[0-9]*[[:space:]]*:/Id" public/guion.txt
          sed -i -E "s/\(($PAL)[[:space:]]*[0-9]*[[:space:]]*:[^)]*\)//Ig; s/\[($PAL)[[:space:]]*[0-9]*[[:space:]]*:[^]]*\]//Ig" public/guion.txt
          sed -i 's/#//g; s/\*//g; s/_//g; s/\[//g; s/\]//g; s/---//g' public/guion.txt
          echo "----- GUION QUE SE VA A NARRAR -----"
          cat public/guion.txt
          echo "------------------------------------"
          VOZ_LISTA=no
          # Voz por defecto: Gemini. Con "gonzalo" se usa la voz de antes.
          VOZ_ELEGIDA="$(printf '%s' "$VOZ_PROPIA" | tr '[:upper:]' '[:lower:]' | tr -d ' ')"
          if [ -z "$VOZ_ELEGIDA" ]; then VOZ_ELEGIDA=gemini; fi
          if [ "$VOZ_ELEGIDA" = "gonzalo" ]; then VOZ_PROPIA=""; fi
          if [ "$VOZ_ELEGIDA" = "gemini" ]; then
            echo "===== Usando la voz natural de Gemini ====="
            if node scripts/voz-gemini.mjs; then
              pip install --quiet faster-whisper
              if python scripts/transcribir-voz.py; then
                VOZ_LISTA=si
              else
                echo "AVISO: no se pudieron sacar los subtítulos de la voz de Gemini, uso la de Gonzalo"
              fi
            else
              echo "AVISO: Gemini no pudo hacer la voz, uso la de Gonzalo"
            fi
            VOZ_PROPIA=""
          fi
          if [ "$VOZ_LISTA" = "si" ]; then
            echo "Voz de Gemini lista"
          elif [ -n "$VOZ_PROPIA" ] && [ -f "public/voces/$VOZ_PROPIA" ]; then
            echo "===== Usando TU voz: $VOZ_PROPIA ====="
            # Limpia la grabacion: quita ruido de fondo y silencios del inicio y del final, e iguala el volumen
            ffmpeg -nostdin -y -loglevel error -i "public/voces/$VOZ_PROPIA" \
              -af "highpass=f=80,afftdn=nf=-25,silenceremove=start_periods=1:start_silence=0.1:start_threshold=-45dB,areverse,silenceremove=start_periods=1:start_silence=0.3:start_threshold=-45dB,areverse" \
              public/voz-limpia.wav
            ffmpeg -nostdin -y -loglevel error -i public/voz-limpia.wav -af "loudnorm=I=-16:TP=-1.5:LRA=11" -ar 44100 -ac 1 -b:a 192k public/voz.mp3
            rm -f public/voz-limpia.wav
            pip install --quiet faster-whisper
            python scripts/transcribir-voz.py
          else
            if [ -n "$VOZ_PROPIA" ]; then
              echo "AVISO: no encontré public/voces/$VOZ_PROPIA, uso la voz de Gonzalo"
            fi
            if edge-tts --voice es-CO-GonzaloNeural --file public/guion.txt --write-media public/voz.mp3 --write-subtitles public/voz.srt; then
              echo "Voz generada con edge-tts"
            else
              echo "===== edge-tts falló, uso Azure con la misma voz de Gonzalo ====="
              node scripts/voz-azure.mjs
              node scripts/srt-desde-audio.mjs
            fi
          fi

      - name: Título y descripción para YouTube
        working-directory: video-agua
        continue-on-error: true
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          TEMA: ${{ steps.tema.outputs.TEMA }}
          TIPO: short
        run: node scripts/generar-metadatos.mjs

      - name: Descargar clips de Pexels
        working-directory: video-agua
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          CLIPS_VERTICAL: 'si'
          # Modo estricto: si no encuentra un clip que coincida, repite uno bueno en vez de meter otra cosa
          CLIPS_ESTRICTO: 'si'
          CLIPS_EVITAR: ${{ inputs.evitar }}
          # Gemini revisa cada clip antes de usarlo (si muestra lo que dice la voz)
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          # Si ningun clip sirve, Cloudflare dibuja la imagen exacta de lo que dice la voz
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLIPS_ESTILO_DIBUJO: ${{ inputs.estilo || '3d' }}
          CLIPS_IMAGENES: ${{ inputs.imagenes || 'alternado' }}
        run: rm -rf public/clips && node scripts/descargar-clips.mjs

      - name: Preparar clips
        working-directory: video-agua
        run: |
          mkdir -p public/clips-mini
          for f in public/clips/*.mp4; do
            n=$(basename "$f")
            ffmpeg -y -loglevel error -stream_loop -1 -i "$f" -t 15 -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" -c:v libx264 -crf 20 -preset veryfast -an "public/clips-mini/$n"
          done
          rm -rf public/clips
          mv public/clips-mini public/clips

      - name: Sacar fotograma de respaldo
        working-directory: video-agua
        run: |
          PRIMERO=$(node -e "const p=require('./public/plan.json');console.log((p.plan||p)[0].clip)" 2>/dev/null || ls public/clips | head -n1)
          ffmpeg -y -loglevel error -ss 0.4 -i "public/clips/$PRIMERO" -frames:v 1 public/portada.jpg
          ls -la public/portada.jpg
          echo "Fotograma de respaldo sacado de $PRIMERO"

      - name: Renderizar Short
        working-directory: video-agua
        run: |
          mkdir -p out
          TITULO=""
          if [ -f out/metadatos.txt ]; then
            TITULO=$(sed -n '2p' out/metadatos.txt)
          fi
          # En los retos la pregunta ya sale animada: sin titulo encima
          if grep -q '"tipo": "reto"' public/plan.json; then
            TITULO=""
            echo "Short de RETO: sin título al inicio"
          fi
          echo "Título en pantalla: $TITULO"
          export REMOTION_TITULO="$TITULO"
          export REMOTION_TITULO_SEG="1.2"
          # Sonidos del reto (tic-tac y error): se fabrican aqui si no existen
          mkdir -p public/sfx
          [ -f public/sfx/tic.mp3 ] || ffmpeg -nostdin -y -loglevel error -f lavfi -i "sine=frequency=1500:duration=0.07" -af "afade=t=out:st=0.03:d=0.04,volume=2" -ar 44100 public/sfx/tic.mp3
          [ -f public/sfx/error.mp3 ] || ffmpeg -nostdin -y -loglevel error -f lavfi -i "aevalsrc=0.35*sgn(sin(2*PI*140*t)):d=0.35:s=44100" -af "afade=t=out:st=0.25:d=0.1" public/sfx/error.mp3
          # Efectos de sonido: si falta alguno, el video sale sin efectos en vez de fallar
          SFX_OK=si
          for s in whoosh pop ding tachar impacto tic error; do
            if [ ! -f "public/sfx/$s.mp3" ]; then
              echo "AVISO: falta public/sfx/$s.mp3, el video sale sin efectos de sonido"
              SFX_OK=no
            fi
          done
          echo "Efectos de sonido: $SFX_OK"
          export REMOTION_SFX="$SFX_OK"
          # Personaje Invi (dibujado en src/Invi.tsx). Para quitarlo, cambia si por no
          export REMOTION_PERSONAJE="si"
          echo "Personaje Invi: $REMOTION_PERSONAJE"
          # Lo que dice el globo de Invi al final: la promesa del canal
          export REMOTION_CIERRE_INVI="¡Sígueme! Cada día, un peligro de tu casa"
          # Musica de fondo: una canción al azar de public/musica/ (si no hay, sale sin música)
          MUSICA=""
          if ls public/musica/*.mp3 >/dev/null 2>&1; then
            ELEGIDA=$(ls public/musica/*.mp3 | shuf -n 1)
            echo "Canción elegida: $(basename "$ELEGIDA")"
            # Se iguala el volumen de todas las canciones, porque unas vienen más fuertes que otras
            ffmpeg -y -loglevel error -i "$ELEGIDA" -af loudnorm=I=-16:TP=-1.5:LRA=11 -ar 44100 -b:a 192k public/musica/fondo.mp3 && MUSICA=fondo.mp3
          fi
          echo "Música de fondo: ${MUSICA:-ninguna}"
          export REMOTION_MUSICA="$MUSICA"
          npx remotion render Short out/short-final.mp4 \
            --concurrency=4 \
            --jpeg-quality=95 \
            --crf=20

      - name: Medir resultado
        working-directory: video-agua
        run: |
          MB=$(du -m out/short-final.mp4 | cut -f1)
          echo "PESO: ${MB} MB"
          ffprobe -v error -show_entries format=duration,bit_rate -of default=noprint_wrappers=1 out/short-final.mp4

      - name: Guardar Short como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            video-agua/out/short-final.mp4
            video-agua/out/metadatos.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Subir Short al repositorio
        env:
          TEMA: ${{ steps.tema.outputs.TEMA }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f video-agua/out/short-final.mp4
          git add temas-shorts.txt
          git commit -m "Short: ${TEMA:0:80}" || true
          # Quita los archivos de trabajo (guion, plan, clips...) para que no estorben al traer tus cambios
          git reset --hard -q HEAD
          git clean -fdq
          # Si mientras se hacía el video tú subiste cambios al repo, primero los trae y luego sube
          for i in 1 2 3; do
            if git pull --rebase -X theirs && git push; then
              echo "Short subido"
              exit 0
            fi
            echo "No se pudo subir (intento $i/3), reintento en 10s..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
