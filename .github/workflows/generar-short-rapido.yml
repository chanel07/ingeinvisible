name: Generar Short RAPIDO

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      tema:
        description: 'Tema del Short (dejar vacío para tomar de la lista)'
        required: false
        type: string

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: video-agua/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache de Remotion (Chromium)
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: remotion-${{ runner.os }}-v1

      - name: Instalar edge-tts
        run: pip install edge-tts

      - name: Instalar FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias de Remotion
        working-directory: video-agua
        run: npm ci

      - name: Elegir tema
        id: tema
        working-directory: video-agua
        env:
          TEMA_INPUT: ${{ inputs.tema }}
        run: |
          if [ -n "$TEMA_INPUT" ]; then
            TEMA="$TEMA_INPUT"
          else
            TEMA=$(node scripts/siguiente-tema.mjs ../temas-shorts.txt)
          fi
          TEMA=$(printf '%s' "$TEMA" | tr '\n' ' ')
          echo "Tema elegido: $TEMA"
          echo "TEMA=$TEMA" >> "$GITHUB_OUTPUT"

      - name: Generar guion y plan con Gemini
        working-directory: video-agua
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TEMA: ${{ steps.tema.outputs.TEMA }}
        run: node scripts/generar-short.mjs

      - name: Limpiar guion y generar voz
        working-directory: video-agua
        run: |
          PAL='clip|toma|escena|visual|imagen|b-roll|seccion|sección|SECCIÓN|section|parte|capitulo|capítulo|CAPÍTULO|titulo|título|TÍTULO|nota'
          sed -i -E "/^[[:space:]]*[(\[]?[0-9]*[.)]?[[:space:]]*($PAL)[[:space:]]*[0-9]*[[:space:]]*:/Id" public/guion.txt
          sed -i -E "s/\(($PAL)[[:space:]]*[0-9]*[[:space:]]*:[^)]*\)//Ig; s/\[($PAL)[[:space:]]*[0-9]*[[:space:]]*:[^]]*\]//Ig" public/guion.txt
          sed -i 's/#//g; s/\*//g; s/_//g; s/\[//g; s/\]//g; s/---//g' public/guion.txt
          echo "----- GUION QUE SE VA A NARRAR -----"
          cat public/guion.txt
          echo "------------------------------------"
          edge-tts --voice es-CO-GonzaloNeural --file public/guion.txt --write-media public/voz.mp3 --write-subtitles public/voz.srt

      - name: Título y descripción para YouTube
        working-directory: video-agua
        continue-on-error: true
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TEMA: ${{ steps.tema.outputs.TEMA }}
          TIPO: short
        run: node scripts/generar-metadatos.mjs

      - name: Descargar clips de Pexels
        working-directory: video-agua
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: rm -rf public/clips && node scripts/descargar-clips.mjs

      - name: Preparar clips
        working-directory: video-agua
        run: |
          mkdir -p public/clips-mini
          for f in public/clips/*.mp4; do
            n=$(basename "$f")
            ffmpeg -y -loglevel error -i "$f" -t 15 -vf "scale=1080:-2" -c:v libx264 -crf 22 -preset veryfast -an "public/clips-mini/$n"
          done
          rm -rf public/clips
          mv public/clips-mini public/clips

      - name: Sacar fotograma de respaldo
        working-directory: video-agua
        run: |
          PRIMERO=$(node -e "const p=require('./public/plan.json');console.log((p.plan||p)[0].clip)" 2>/dev/null || ls public/clips | head -n1)
          ffmpeg -y -loglevel error -ss 0.4 -i "public/clips/$PRIMERO" -frames:v 1 public/portada.jpg
          ls -la public/portada.jpg
          echo "Fotograma de respaldo sacado de $PRIMERO"

      - name: Renderizar Short
        working-directory: video-agua
        run: |
          mkdir -p out
          TITULO=""
          if [ -f out/metadatos.txt ]; then
            TITULO=$(sed -n '2p' out/metadatos.txt)
          fi
          echo "Título en pantalla: $TITULO"
          export REMOTION_TITULO="$TITULO"
          npx remotion render Short out/short-final.mp4 \
            --concurrency=2 \
            --jpeg-quality=95 \
            --crf=20

      - name: Medir resultado
        working-directory: video-agua
        run: |
          MB=$(du -m out/short-final.mp4 | cut -f1)
          echo "PESO: ${MB} MB"
          ffprobe -v error -show_entries format=duration,bit_rate -of default=noprint_wrappers=1 out/short-final.mp4

      - name: Subir Short al repositorio
        env:
          TEMA: ${{ steps.tema.outputs.TEMA }}
        run: |
          cd video-agua
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f out/short-final.mp4
          git commit -m "Short: ${TEMA:0:80}"
          git push
          cd ..
          git add temas-shorts.txt
          git commit -m "Marcar tema usado" || true
          git push || true
