name: Generar Short RAPIDO

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      tema:
        description: 'Tema del Short (dejar vacío para tomar de la lista)'
        required: false
        type: string
      voz:
        description: 'Tu voz grabada: nombre del archivo en video-agua/public/voces/ (vacío = voz de Gonzalo)'
        required: false
        type: string

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: video-agua/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache de Remotion (Chromium)
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: remotion-${{ runner.os }}-v1

      - name: Instalar edge-tts
        run: pip install --upgrade edge-tts

      - name: Instalar FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias de Remotion
        working-directory: video-agua
        run: npm ci

      - name: Elegir tema
        id: tema
        working-directory: video-agua
        env:
          TEMA_INPUT: ${{ inputs.tema }}
        run: |
          if [ -n "$TEMA_INPUT" ]; then
            TEMA="$TEMA_INPUT"
          else
            TEMA=$(node scripts/siguiente-tema.mjs ../temas-shorts.txt)
          fi
          TEMA=$(printf '%s' "$TEMA" | tr '\n' ' ')
          echo "Tema elegido: $TEMA"
          echo "TEMA=$TEMA" >> "$GITHUB_OUTPUT"

      - name: Generar guion y plan con Gemini
        working-directory: video-agua
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          TEMA: ${{ steps.tema.outputs.TEMA }}
        run: node scripts/generar-short.mjs

      - name: Limpiar guion y generar voz
        working-directory: video-agua
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: eastus
          VOZ_PROPIA: ${{ inputs.voz }}
        run: |
          PAL='clip|toma|escena|visual|imagen|b-roll|seccion|sección|SECCIÓN|section|parte|capitulo|capítulo|CAPÍTULO|titulo|título|TÍTULO|nota'
          sed -i -E "/^[[:space:]]*[(\[]?[0-9]*[.)]?[[:space:]]*($PAL)[[:space:]]*[0-9]*[[:space:]]*:/Id" public/guion.txt
          sed -i -E "s/\(($PAL)[[:space:]]*[0-9]*[[:space:]]*:[^)]*\)//Ig; s/\[($PAL)[[:space:]]*[0-9]*[[:space:]]*:[^]]*\]//Ig" public/guion.txt
          sed -i 's/#//g; s/\*//g; s/_//g; s/\[//g; s/\]//g; s/---//g' public/guion.txt
          echo "----- GUION QUE SE VA A NARRAR -----"
          cat public/guion.txt
          echo "------------------------------------"
          if [ -n "$VOZ_PROPIA" ] && [ -f "public/voces/$VOZ_PROPIA" ]; then
            echo "===== Usando TU voz: $VOZ_PROPIA ====="
            # Limpia la grabacion: quita ruido de fondo y silencios del inicio y del final, e iguala el volumen
            ffmpeg -nostdin -y -loglevel error -i "public/voces/$VOZ_PROPIA" \
              -af "highpass=f=80,afftdn=nf=-25,silenceremove=start_periods=1:start_silence=0.1:start_threshold=-45dB,areverse,silenceremove=start_periods=1:start_silence=0.3:start_threshold=-45dB,areverse" \
              public/voz-limpia.wav
            ffmpeg -nostdin -y -loglevel error -i public/voz-limpia.wav -af "loudnorm=I=-16:TP=-1.5:LRA=11" -ar 44100 -ac 1 -b:a 192k public/voz.mp3
            rm -f public/voz-limpia.wav
            pip install --quiet faster-whisper
            python scripts/transcribir-voz.py
          else
            if [ -n "$VOZ_PROPIA" ]; then
              echo "AVISO: no encontré public/voces/$VOZ_PROPIA, uso la voz de Gonzalo"
            fi
            if edge-tts --voice es-CO-GonzaloNeural --file public/guion.txt --write-media public/voz.mp3 --write-subtitles public/voz.srt; then
              echo "Voz generada con edge-tts"
            else
              echo "===== edge-tts falló, uso Azure con la misma voz de Gonzalo ====="
              node scripts/voz-azure.mjs
              node scripts/srt-desde-audio.mjs
            fi
          fi

      - name: Título y descripción para YouTube
        working-directory: video-agua
        continue-on-error: true
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          TEMA: ${{ steps.tema.outputs.TEMA }}
          TIPO: short
        run: node scripts/generar-metadatos.mjs

      - name: Descargar clips de Pexels
        working-directory: video-agua
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          CLIPS_VERTICAL: 'si'
        run: rm -rf public/clips && node scripts/descargar-clips.mjs

      - name: Preparar clips
        working-directory: video-agua
        run: |
          mkdir -p public/clips-mini
          for f in public/clips/*.mp4; do
            n=$(basename "$f")
            ffmpeg -y -loglevel error -stream_loop -1 -i "$f" -t 15 -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" -c:v libx264 -crf 20 -preset veryfast -an "public/clips-mini/$n"
          done
          rm -rf public/clips
          mv public/clips-mini public/clips

      - name: Sacar fotograma de respaldo
        working-directory: video-agua
        run: |
          PRIMERO=$(node -e "const p=require('./public/plan.json');console.log((p.plan||p)[0].clip)" 2>/dev/null || ls public/clips | head -n1)
          ffmpeg -y -loglevel error -ss 0.4 -i "public/clips/$PRIMERO" -frames:v 1 public/portada.jpg
          ls -la public/portada.jpg
          echo "Fotograma de respaldo sacado de $PRIMERO"

      - name: Renderizar Short
        working-directory: video-agua
        run: |
          mkdir -p out
          TITULO=""
          if [ -f out/metadatos.txt ]; then
            TITULO=$(sed -n '2p' out/metadatos.txt)
          fi
          echo "Título del video: $TITULO (en el Short no sale en pantalla: arranca Invi saludando)"
          export REMOTION_TITULO=""
          export REMOTION_TITULO_SEG="1.2"
          # Efectos de sonido: si falta alguno, el video sale sin efectos en vez de fallar
          SFX_OK=si
          for s in whoosh pop ding tachar impacto; do
            if [ ! -f "public/sfx/$s.mp3" ]; then
              echo "AVISO: falta public/sfx/$s.mp3, el video sale sin efectos de sonido"
              SFX_OK=no
            fi
          done
          echo "Efectos de sonido: $SFX_OK"
          export REMOTION_SFX="$SFX_OK"
          # Personaje Invi (dibujado en src/Invi.tsx). Para quitarlo, cambia si por no
          export REMOTION_PERSONAJE="si"
          echo "Personaje Invi: $REMOTION_PERSONAJE"
          # Musica de fondo: una canción al azar de public/musica/ (si no hay, sale sin música)
          MUSICA=""
          if ls public/musica/*.mp3 >/dev/null 2>&1; then
            ELEGIDA=$(ls public/musica/*.mp3 | shuf -n 1)
            echo "Canción elegida: $(basename "$ELEGIDA")"
            # Se iguala el volumen de todas las canciones, porque unas vienen más fuertes que otras
            ffmpeg -y -loglevel error -i "$ELEGIDA" -af loudnorm=I=-16:TP=-1.5:LRA=11 -ar 44100 -b:a 192k public/musica/fondo.mp3 && MUSICA=fondo.mp3
          fi
          echo "Música de fondo: ${MUSICA:-ninguna}"
          export REMOTION_MUSICA="$MUSICA"
          npx remotion render Short out/short-final.mp4 \
            --concurrency=4 \
            --jpeg-quality=95 \
            --crf=20

      - name: Medir resultado
        working-directory: video-agua
        run: |
          MB=$(du -m out/short-final.mp4 | cut -f1)
          echo "PESO: ${MB} MB"
          ffprobe -v error -show_entries format=duration,bit_rate -of default=noprint_wrappers=1 out/short-final.mp4

      - name: Subir Short al repositorio
        env:
          TEMA: ${{ steps.tema.outputs.TEMA }}
        run: |
          cd video-agua
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f out/short-final.mp4
          git commit -m "Short: ${TEMA:0:80}"
          git push
          cd ..
          git add temas-shorts.txt
          git commit -m "Marcar tema usado" || true
          git push || true
