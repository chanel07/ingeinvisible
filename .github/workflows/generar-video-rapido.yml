name: Generar Video RAPIDO

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      tema:
        description: 'Tema del video (dejar vacío para tomar de la lista)'
        required: false
        type: string
      minutos:
        description: 'Duración del video (8 o 10 = estilo documental)'
        required: false
        type: choice
        default: '4'
        options:
          - '4'
          - '8'
          - '10'
      evitar:
        description: 'Clips que NO deben salir, en inglés separados por coma (ej: car, engine, fan)'
        required: false
        type: string

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: video-agua/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache de Remotion (Chromium)
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: remotion-${{ runner.os }}-v1

      - name: Instalar edge-tts
        run: pip install --upgrade edge-tts

      - name: Instalar FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias de Remotion
        working-directory: video-agua
        run: npm ci

      - name: Elegir tema
        id: tema
        working-directory: video-agua
        env:
          TEMA_INPUT: ${{ inputs.tema }}
        run: |
          if [ -n "$TEMA_INPUT" ]; then
            TEMA="$TEMA_INPUT"
          else
            TEMA=$(node scripts/siguiente-tema.mjs ../temas.txt)
          fi
          TEMA=$(printf '%s' "$TEMA" | tr '\n' ' ')
          echo "Tema elegido: $TEMA"
          echo "TEMA=$TEMA" >> "$GITHUB_OUTPUT"

      - name: Generar guion y plan con Gemini
        working-directory: video-agua
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          TEMA: ${{ steps.tema.outputs.TEMA }}
          MINUTOS: ${{ inputs.minutos || '4' }}
        run: node scripts/generar-guion.mjs

      - name: Limpiar guion y generar voz
        working-directory: video-agua
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: eastus
        run: |
          PAL='clip|toma|escena|visual|imagen|b-roll|seccion|sección|SECCIÓN|section|parte|capitulo|capítulo|CAPÍTULO|titulo|título|TÍTULO|nota'
          sed -i -E "/^[[:space:]]*[(\[]?[0-9]*[.)]?[[:space:]]*($PAL)[[:space:]]*[0-9]*[[:space:]]*:/Id" public/guion.txt
          sed -i -E "s/\(($PAL)[[:space:]]*[0-9]*[[:space:]]*:[^)]*\)//Ig; s/\[($PAL)[[:space:]]*[0-9]*[[:space:]]*:[^]]*\]//Ig" public/guion.txt
          sed -i 's/#//g; s/\*//g; s/_//g; s/\[//g; s/\]//g; s/---//g' public/guion.txt
          echo "----- GUION QUE SE VA A NARRAR -----"
          cat public/guion.txt
          echo "------------------------------------"
          if edge-tts --voice es-CO-GonzaloNeural --file public/guion.txt --write-media public/voz.mp3 --write-subtitles public/voz.srt; then
            echo "Voz generada con edge-tts"
          else
            echo "===== edge-tts falló, uso Azure con la misma voz de Gonzalo ====="
            node scripts/voz-azure.mjs
            node scripts/srt-desde-audio.mjs
          fi

      - name: Título y descripción para YouTube
        working-directory: video-agua
        continue-on-error: true
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          TEMA: ${{ steps.tema.outputs.TEMA }}
          TIPO: largo
        run: node scripts/generar-metadatos.mjs

      - name: Descargar clips de Pexels
        working-directory: video-agua
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          CLIPS_EVITAR: ${{ inputs.evitar }}
          CLIPS_ESTRICTO: 'si'
        run: rm -rf public/clips && node scripts/descargar-clips.mjs

      - name: Preparar clips
        working-directory: video-agua
        run: |
          mkdir -p public/clips-mini
          for f in public/clips/*.mp4; do
            n=$(basename "$f")
            ffmpeg -y -loglevel error -stream_loop -1 -i "$f" -t 20 -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080" -c:v libx264 -crf 21 -preset veryfast -an "public/clips-mini/$n"
          done
          rm -rf public/clips
          mv public/clips-mini public/clips

      - name: Sacar fotograma de respaldo
        working-directory: video-agua
        run: |
          PRIMERO=$(node -e "const p=require('./public/plan.json');console.log((p.plan||p)[0].clip)" 2>/dev/null || ls public/clips | head -n1)
          ffmpeg -y -loglevel error -ss 0.4 -i "public/clips/$PRIMERO" -frames:v 1 public/portada.jpg
          ls -la public/portada.jpg
          echo "Fotograma de respaldo sacado de $PRIMERO"

      - name: Renderizar video
        working-directory: video-agua
        run: |
          mkdir -p out
          # Titulo grande al inicio (sale del titulo de YouTube que genera el sistema)
          TITULO=""
          if [ -f out/metadatos.txt ]; then
            TITULO=$(sed -n '2p' out/metadatos.txt)
          fi
          echo "Título en pantalla: $TITULO"
          export REMOTION_TITULO="$TITULO"
          # Efectos de sonido: si falta alguno, el video sale sin efectos en vez de fallar
          SFX_OK=si
          for s in whoosh pop ding tachar impacto; do
            if [ ! -f "public/sfx/$s.mp3" ]; then
              echo "AVISO: falta public/sfx/$s.mp3, el video sale sin efectos de sonido"
              SFX_OK=no
            fi
          done
          echo "Efectos de sonido: $SFX_OK"
          export REMOTION_SFX="$SFX_OK"
          # Musica de fondo: una canción al azar de public/musica/ (si no hay, sale sin música)
          MUSICA=""
          if ls public/musica/*.mp3 >/dev/null 2>&1; then
            ELEGIDA=$(ls public/musica/*.mp3 | shuf -n 1)
            echo "Canción elegida: $(basename "$ELEGIDA")"
            # Se iguala el volumen de todas las canciones, porque unas vienen más fuertes que otras
            ffmpeg -y -loglevel error -i "$ELEGIDA" -af loudnorm=I=-16:TP=-1.5:LRA=11 -ar 44100 -b:a 192k public/musica/fondo.mp3 && MUSICA=fondo.mp3
          fi
          echo "Música de fondo: ${MUSICA:-ninguna}"
          export REMOTION_MUSICA="$MUSICA"
          npx remotion render AguaGrifo out/video-final.mp4 \
            --concurrency=4 \
            --jpeg-quality=95 \
            --crf=21

      - name: Medir resultado
        working-directory: video-agua
        run: |
          MB=$(du -m out/video-final.mp4 | cut -f1)
          echo "PESO: ${MB} MB"
          ffprobe -v error -show_entries format=duration,bit_rate -of default=noprint_wrappers=1 out/video-final.mp4

      - name: Subir video como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            video-agua/out/video-final.mp4
            video-agua/out/metadatos.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Marcar tema usado
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add temas.txt
          git commit -m "Marcar tema usado" || true
          git push || true
