name: Generar Perros Humor

on:
  workflow_dispatch:
    inputs:
      tema:
        description: 'Situación graciosa (dejar vacío para elegir una al azar)'
        required: false
        type: string

jobs:
  humor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: video-agua/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache de Remotion (Chromium)
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: remotion-${{ runner.os }}-v1

      - name: Instalar edge-tts
        run: pip install --upgrade edge-tts

      - name: Instalar FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias de Remotion
        working-directory: video-agua
        run: npm ci

      - name: Generar guion y plan
        working-directory: video-agua
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          TEMA: ${{ inputs.tema }}
        run: node scripts/generar-perros-humor.mjs

      - name: Limpiar guion y generar voz
        working-directory: video-agua
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: eastus
          VOZ: es-MX-JorgeNeural
        run: |
          sed -i 's/#//g; s/\*//g; s/_//g; s/\[//g; s/\]//g; s/---//g' public/guion.txt
          echo "----- GUION QUE SE VA A NARRAR -----"
          cat public/guion.txt
          echo "------------------------------------"
          if edge-tts --voice es-MX-JorgeNeural --pitch=+15Hz --rate=+8% --file public/guion.txt --write-media public/voz.mp3 --write-subtitles public/voz.srt; then
            echo "Voz generada con edge-tts (Jorge)"
          else
            echo "===== edge-tts falló, uso Azure con la voz de Jorge ====="
            node scripts/voz-azure.mjs
            node scripts/srt-desde-audio.mjs
          fi

      - name: Descargar clips
        working-directory: video-agua
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          CLIPS_OBLIGATORIA: 'dog|dogs|puppy|puppies'
        run: rm -rf public/clips && node scripts/descargar-clips.mjs

      - name: Preparar clips
        working-directory: video-agua
        run: |
          mkdir -p public/clips-mini
          for f in public/clips/*.mp4; do
            n=$(basename "$f")
            ffmpeg -y -loglevel error -i "$f" -t 15 -vf "scale=1080:-2" -c:v libx264 -crf 22 -preset veryfast -an "public/clips-mini/$n"
          done
          rm -rf public/clips
          mv public/clips-mini public/clips

      - name: Sacar fotograma de respaldo
        working-directory: video-agua
        run: |
          PRIMERO=$(node -e "const p=require('./public/plan.json');console.log((p.plan||p)[0].clip)" 2>/dev/null || ls public/clips | head -n1)
          ffmpeg -y -loglevel error -ss 0.4 -i "public/clips/$PRIMERO" -frames:v 1 public/portada.jpg
          echo "Fotograma de respaldo sacado de $PRIMERO"

      - name: Renderizar Reel
        working-directory: video-agua
        env:
          REMOTION_MARCA: ' '
        run: |
          mkdir -p out
          npx remotion render Short out/perros-humor-final.mp4 \
            --concurrency=2 \
            --jpeg-quality=95 \
            --crf=20

      - name: Medir resultado
        working-directory: video-agua
        run: |
          MB=$(du -m out/perros-humor-final.mp4 | cut -f1)
          echo "PESO: ${MB} MB"
          ffprobe -v error -show_entries format=duration,bit_rate -of default=noprint_wrappers=1 out/perros-humor-final.mp4

      - name: Subir Reel al repositorio
        run: |
          cd video-agua
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f out/perros-humor-final.mp4
          git add -f clips-usados.json || true
          git commit -m "Perros humor"
          git push
